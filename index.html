<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the mobile header/nav honour the notch + home indicator;
         maximum-scale=5 keeps pinch-zoom available for accessibility. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5"
    />
    <title>مُدارا | فروشگاه آنلاین مد و فشن</title>
    <meta name="description" content="فروشگاه آنلاین مُدارا - جدیدترین لباس‌ها، اکسسوری‌ها، عینک و ساعت‌های لوکس با بهترین قیمت" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" content="#efeae1" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph / Twitter: __SITE_URL__ is filled at build time by vite.config.ts
         (Netlify sets $URL / $DEPLOY_PRIME_URL automatically, so shares always point
         at the site that actually built the page). -->
    <link rel="canonical" href="__SITE_URL__/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="مُدارا" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="مُدارا | فروشگاه آنلاین مد و فشن" />
    <meta property="og:description" content="کت، ترنچ‌کت، هودی و بافت‌ها؛ کالکشن پاییز مُدارا، هر قطعه از بغل روی یک رگال." />
    <meta property="og:image" content="__SITE_URL__/images/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="رگال لباس‌های کالکشن مُدارا" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="مُدارا | فروشگاه آنلاین مد و فشن" />
    <meta name="twitter:description" content="کت، ترنچ‌کت، هودی و بافت‌ها؛ کالکشن پاییز مُدارا، هر قطعه از بغل روی یک رگال." />
    <meta name="twitter:image" content="__SITE_URL__/images/og-cover.jpg" />

    <!-- Persian + display type is self-hosted (see src/main.tsx → @fontsource), so it no
         longer depends on fonts.googleapis.com. On mobile networks that host is often
         slow or blocked, which made the whole site render in the 16px system fallback
         (Arial/Tahoma) and look small and uneven across devices. -->
    <link rel="preload" href="%BASE_URL%fonts/beiruti-arabic-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/beiruti-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="%BASE_URL%fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
